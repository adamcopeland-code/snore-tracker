// ---- charts
function theme() {
  const cs = getComputedStyle(document.documentElement);
  const g = (n) => cs.getPropertyValue(n).trim();
  return {
    text: g('--chart-text') || '#a4acd0',
    grid: g('--chart-grid') || 'rgba(160,170,210,.2)',
    line: g('--chart-line') || g('--accent'),
    accent: g('--accent'),
    surface: g('--surface'),
    strong: g('--text'),
    classes: [g('--c-quiet'), g('--c-light'), g('--c-loud'), g('--c-epic')],
    font: getComputedStyle(document.body).fontFamily || 'sans-serif'
  };
}
function fitCanvas(canvas) {
  const r = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(120, Math.round(r.width));
  const h = Math.max(120, Math.round(r.height));
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}

// Night timeline: 5 minute bars stacked by intensity class.
const BIN_MS = 300000;
function timelineModel(s) {
  const origin = s.start;
  const lastMin = s.minutes.length ? s.minutes[s.minutes.length - 1].t + 60000 : s.start + 60000;
  const endMs = Math.max(s.end || lastMin, origin + 60000);
  const total = endMs - origin;
  const nb = Math.max(1, Math.ceil(total / BIN_MS));
  const bins = [];
  for (let i = 0; i < nb; i++) bins.push({ t0: origin + i * BIN_MS, t1: Math.min(endMs, origin + (i + 1) * BIN_MS), v: [0, 0, 0, 0] });
  for (const m of s.minutes) {
    const i = Math.min(nb - 1, Math.max(0, Math.floor((m.t + 30000 - origin) / BIN_MS)));
    CLASS_KEYS.forEach((k, j) => { bins[i].v[j] += (m[k + 'Sec'] || 0) / 60; });
  }
  let maxStack = 0;
  bins.forEach((b) => { b.sum = b.v[0] + b.v[1] + b.v[2] + b.v[3]; if (b.sum > maxStack) maxStack = b.sum; });
  const yMax = Math.min(5, Math.max(1, Math.ceil(maxStack)));
  return { origin, endMs, total, nb, bins, yMax, maxStack };
}
function timelineAria(s) {
  const m = timelineModel(s);
  const sc = scoreOf(s);
  return 'Timeline of snoring from ' + fmtClock(s.start) + ' to ' + fmtClock(m.endMs) + ', in 5 minute bars. ' + fmtMin(sc.snoreSec) + ' minutes of snoring in total. Busiest bar: ' + m.maxStack.toFixed(1) + ' minutes.';
}
const TL = { L: 46, R: 10, T: 12, B: 28 };
function drawTimeline(canvas, m, hover) {
  const { ctx, w, h } = fitCanvas(canvas);
  const th = theme();
  const pw = w - TL.L - TL.R, ph = h - TL.T - TL.B;
  ctx.clearRect(0, 0, w, h);
  ctx.font = '11px ' + th.font;
  ctx.lineWidth = 1;
  // y axis: minutes of snoring per bar
  const step = m.yMax <= 2 ? 0.5 : 1;
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let v = 0; v <= m.yMax + 1e-9; v += step) {
    const y = Math.round(TL.T + ph - (v / m.yMax) * ph) + 0.5;
    ctx.strokeStyle = th.grid;
    ctx.beginPath(); ctx.moveTo(TL.L, y); ctx.lineTo(TL.L + pw, y); ctx.stroke();
    ctx.fillStyle = th.text;
    ctx.fillText(step < 1 ? v.toFixed(1) : String(v), TL.L - 6, y);
  }
  ctx.save();
  ctx.translate(11, TL.T + ph / 2); ctx.rotate(-Math.PI / 2);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = th.text;
  ctx.fillText('Minutes snoring per bar', 0, 0);
  ctx.restore();
  // bars
  const bw = pw / m.nb;
  const gap = bw > 5 ? 1.5 : bw > 2.5 ? 1 : 0;
  m.bins.forEach((b, i) => {
    const x = TL.L + ((b.t0 - m.origin) / m.total) * pw;
    const x2 = TL.L + ((b.t1 - m.origin) / m.total) * pw;
    let y = TL.T + ph;
    for (let j = 0; j < 4; j++) {
      const hh = (Math.min(b.v[j], m.yMax) / m.yMax) * ph;
      if (hh <= 0) continue;
      ctx.fillStyle = th.classes[j];
      ctx.fillRect(x + gap / 2, y - hh, Math.max(1, x2 - x - gap), hh);
      y -= hh;
    }
    if (i === hover) {
      ctx.strokeStyle = th.strong; ctx.lineWidth = 1.5;
      ctx.strokeRect(x + 0.5, TL.T + 0.5, Math.max(2, x2 - x - 1), ph - 1);
      ctx.lineWidth = 1;
    }
  });
  // x axis: hour labels
  ctx.strokeStyle = th.grid;
  ctx.beginPath(); ctx.moveTo(TL.L, TL.T + ph + 0.5); ctx.lineTo(TL.L + pw, TL.T + ph + 0.5); ctx.stroke();
  const hours = m.total / 3600000;
  const stepH = [1, 2, 3, 4, 6, 12].find((sh) => (sh * 3600000 / m.total) * pw >= 48) || 12;
  const d = new Date(m.origin); d.setMinutes(0, 0, 0);
  let t = d.getTime(); while (t < m.origin) t += 3600000;
  ctx.fillStyle = th.text; ctx.textBaseline = 'top'; ctx.textAlign = 'center';
  let lastLabelX = -1e9;
  for (; t <= m.endMs; t += 3600000) {
    const hr = new Date(t).getHours();
    if (hours >= 2 && hr % stepH !== 0 && stepH > 1) continue;
    const x = TL.L + ((t - m.origin) / m.total) * pw;
    if (x - lastLabelX < 44) continue;
    ctx.strokeStyle = th.grid;
    ctx.beginPath(); ctx.moveTo(Math.round(x) + 0.5, TL.T + ph); ctx.lineTo(Math.round(x) + 0.5, TL.T + ph + 4); ctx.stroke();
    const label = pad(hr) + ':00';
    const tw = ctx.measureText(label).width;
    const lx = Math.min(w - tw / 2 - 2, Math.max(TL.L + tw / 2 - 4, x));
    ctx.fillText(label, lx, TL.T + ph + 7);
    lastLabelX = x;
  }
  return { bw, pw, ph };
}

// Score trend: line with points for the last 30 nights.
function trendModel(list) {
  const nights = list.slice(0, 30).reverse().map((s) => ({ s, score: scoreOf(s).score }));
  const maxScore = Math.max(50, ...nights.map((n) => n.score));
  const yMax = Math.ceil(maxScore / 10) * 10;
  return { nights, yMax };
}
const TR = { L: 36, R: 14, T: 22, B: 28 };
function drawTrend(canvas, m, hover) {
  const { ctx, w, h } = fitCanvas(canvas);
  const th = theme();
  const pw = w - TR.L - TR.R, ph = h - TR.T - TR.B;
  ctx.clearRect(0, 0, w, h);
  ctx.font = '11px ' + th.font; ctx.lineWidth = 1;
  const yPix = (v) => TR.T + ph - (v / m.yMax) * ph;
  const n = m.nights.length;
  const xPix = (i) => TR.L + (n === 1 ? pw / 2 : (i / (n - 1)) * pw);
  const stepV = m.yMax <= 50 ? 10 : m.yMax <= 100 ? 25 : 50;
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let v = 0; v <= m.yMax; v += stepV) {
    const y = Math.round(yPix(v)) + 0.5;
    ctx.strokeStyle = th.grid;
    ctx.beginPath(); ctx.moveTo(TR.L, y); ctx.lineTo(TR.L + pw, y); ctx.stroke();
    ctx.fillStyle = th.text; ctx.fillText(String(v), TR.L - 6, y);
  }
  // rating boundaries, dashed
  ctx.setLineDash([3, 4]);
  [[10, 'mild'], [25, 'moderate'], [50, 'severe']].forEach((b) => {
    if (b[0] > m.yMax) return;
    const y = Math.round(yPix(b[0])) + 0.5;
    ctx.strokeStyle = th.text; ctx.globalAlpha = 0.35;
    ctx.beginPath(); ctx.moveTo(TR.L, y); ctx.lineTo(TR.L + pw, y); ctx.stroke();
    ctx.globalAlpha = 1;
  });
  ctx.setLineDash([]);
  // line
  ctx.strokeStyle = th.line; ctx.lineWidth = 2; ctx.lineJoin = 'round';
  ctx.beginPath();
  m.nights.forEach((p, i) => { const x = xPix(i), y = yPix(p.score); if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); });
  ctx.stroke();
  // points; the last one is emphasised
  m.nights.forEach((p, i) => {
    const x = xPix(i), y = yPix(p.score), last = i === n - 1;
    ctx.fillStyle = last ? th.line : th.surface;
    ctx.strokeStyle = th.line; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, last ? 6 : 3.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (i === hover && !last) { ctx.lineWidth = 2; ctx.strokeStyle = th.strong; ctx.beginPath(); ctx.arc(x, y, 6.5, 0, Math.PI * 2); ctx.stroke(); }
  });
  const lastP = m.nights[n - 1];
  ctx.fillStyle = th.strong; ctx.font = 'bold 12px ' + th.font; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
  ctx.fillText(lastP.score.toFixed(1), Math.min(w - 2, xPix(n - 1) + 14), yPix(lastP.score) - 9);
  // x labels: dates
  ctx.font = '11px ' + th.font; ctx.fillStyle = th.text; ctx.textBaseline = 'top';
  const want = Math.max(2, Math.min(n, Math.floor(pw / 70)));
  let lastX = -1e9;
  for (let k = 0; k < want; k++) {
    const i = n === 1 ? 0 : Math.round((k / (want - 1)) * (n - 1));
    const x = xPix(i);
    if (x - lastX < 56) continue;
    const label = nightDate(m.nights[i].s).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    const tw = ctx.measureText(label).width;
    ctx.textAlign = 'center';
    ctx.fillText(label, Math.min(w - tw / 2 - 2, Math.max(tw / 2 + 2, x)), TR.T + ph + 8);
    lastX = x;
  }
  return { xPix, yPix };
}

// Shared hover/tap/keyboard handling for both charts.
function wireHover(canvas, tip, spec) {
  let cur = -1;
  const set = (i) => {
    if (i === cur) return;
    cur = i;
    spec.redraw(i);
    if (i < 0) { tip.hidden = true; return; }
    tip.innerHTML = spec.html(i);
    tip.hidden = false;
    const a = spec.anchor(i);
    const tw = tip.offsetWidth, th = tip.offsetHeight, cw = canvas.getBoundingClientRect().width;
    tip.style.left = Math.max(0, Math.min(cw - tw, a.x - tw / 2)) + 'px';
    tip.style.top = Math.max(0, a.y - th - 10) + 'px';
  };
  const at = (e) => {
    const r = canvas.getBoundingClientRect();
    return spec.indexAt(e.clientX - r.left, e.clientY - r.top);
  };
  canvas.addEventListener('pointermove', (e) => set(at(e)));
  canvas.addEventListener('pointerdown', (e) => set(at(e)));
  canvas.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') set(-1); });
  canvas.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      e.preventDefault();
      const d = e.key === 'ArrowRight' ? 1 : -1;
      set(Math.max(0, Math.min(spec.count - 1, cur < 0 ? (d > 0 ? 0 : spec.count - 1) : cur + d)));
    } else if (e.key === 'Escape') set(-1);
  });
  canvas.addEventListener('blur', () => set(-1));
  const outside = (e) => { if (!canvas.isConnected) { document.removeEventListener('pointerdown', outside); return; } if (e.target !== canvas) set(-1); };
  document.addEventListener('pointerdown', outside);
}

function mountTimeline(canvas, tip, s) {
  const m = timelineModel(s);
  let geo = null, hover = -1;
  const draw = () => { geo = drawTimeline(canvas, m, hover); };
  const redraw = (i) => { hover = i; draw(); };
  draw();
  state.charts.push(draw);
  const barX = (i) => { const b = m.bins[i]; return TL.L + (((b.t0 + b.t1) / 2 - m.origin) / m.total) * geo.pw; };
  wireHover(canvas, tip, {
    count: m.nb,
    redraw,
    indexAt: (x) => {
      if (x < TL.L || x > TL.L + geo.pw) return -1;
      const t = m.origin + ((x - TL.L) / geo.pw) * m.total;
      return Math.max(0, Math.min(m.nb - 1, Math.floor((t - m.origin) / BIN_MS)));
    },
    anchor: (i) => ({ x: barX(i), y: TL.T + geo.ph - (Math.min(m.bins[i].sum, m.yMax) / m.yMax) * geo.ph }),
    html: (i) => {
      const b = m.bins[i];
      let h = '<b>' + fmtClock(b.t0) + ' to ' + fmtClock(b.t1) + '</b><br>' + b.sum.toFixed(1) + ' min snoring';
      CLASS_KEYS.forEach((k, j) => { if (b.v[j] > 0.049) h += '<br>' + CLS_LABEL[k] + ' ' + b.v[j].toFixed(1) + ' min'; });
      return h;
    }
  });
}

function mountTrend(canvas, tip, list) {
  const m = trendModel(list);
  let geo = null, hover = -1;
  const draw = () => { geo = drawTrend(canvas, m, hover); };
  draw();
  state.charts.push(draw);
  wireHover(canvas, tip, {
    count: m.nights.length,
    redraw: (i) => { hover = i; draw(); },
    indexAt: (x) => {
      let best = -1, bd = 22;
      m.nights.forEach((_, i) => { const d = Math.abs(geo.xPix(i) - x); if (d < bd) { bd = d; best = i; } });
      return best;
    },
    anchor: (i) => ({ x: geo.xPix(i), y: geo.yPix(m.nights[i].score) }),
    html: (i) => {
      const p = m.nights[i];
      return '<b>' + esc(fmtNight(p.s)) + '</b><br>Score ' + p.score.toFixed(1) + ' (' + esc(ratingFor(p.score).label) + ')';
    }
  });
}

// ---- app
const state = {
  settings: normalizeSettings(null), sessions: [], recorder: null, starting: false,
  route: { view: 'home', arg: null }, micError: null, notice: '', charts: [], noteTimer: null, micTest: null
};
const $ = (id) => document.getElementById(id);

let toastTimer = null;
function toast(msg, ms) {
  const el = $('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms || 3800);
}
function reportError(msg, e) {
  try { console.error(msg, e); } catch (x) { /* ignore */ }
  toast(msg);
}

// ---- routing and rendering
function parseRoute() {
  const parts = (location.hash || '#/').replace(/^#/, '').split('/').filter(Boolean);
  if (parts[0] === 'history') return { view: 'history', arg: null };
  if (parts[0] === 'settings') return { view: 'settings', arg: null };
  if (parts[0] === 'night' && parts[1]) return { view: 'night', arg: decodeURIComponent(parts[1]) };
  return { view: 'home', arg: null };
}
function render(keepScroll) {
  const r = state.route;
  state.charts = [];
  let html;
  if (r.view === 'history') html = viewHistory();
  else if (r.view === 'settings') html = viewSettings();
  else if (r.view === 'night') html = viewNight(r.arg);
  else html = viewHome();
  $('main').innerHTML = html;
  document.querySelectorAll('.tabs a').forEach((a) => {
    const active = (a.dataset.tab === 'home' && (r.view === 'home')) || (a.dataset.tab === 'history' && (r.view === 'history' || r.view === 'night')) || (a.dataset.tab === 'settings' && r.view === 'settings');
    if (active) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  try {
    if (r.view === 'night') mountNightView();
    else if (r.view === 'history') mountHistoryView();
    else if (r.view === 'settings') mountSettingsView();
  } catch (e) { reportError('Something went wrong drawing this page.', e); }
  if (!keepScroll) window.scrollTo(0, 0);
}
function onRoute() {
  flushNote();
  stopPlayback();
  stopMicTest();
  state.route = parseRoute();
  render(false);
}
function go(hash) {
  if (location.hash === hash) onRoute(); else location.hash = hash;
}
function mountNightView() {
  const s = state.sessions.find((x) => x.id === state.route.arg);
  if (!s) return;
  mountTimeline($('tl-canvas'), $('tlTip'), s);
}
function mountHistoryView() {
  const c = $('trend');
  if (c) mountTrend(c, $('trendTip'), doneSessions());
}
function mountSettingsView() {
  if (navigator.storage && navigator.storage.estimate) {
    navigator.storage.estimate().then((e) => {
      const el = $('storageInfo');
      if (el && e && e.usage != null) el.textContent = 'Using about ' + (e.usage / 1048576).toFixed(1) + ' MB.';
    }).catch(() => {});
  }
}
let resizeRaf = 0;
function redrawCharts() {
  cancelAnimationFrame(resizeRaf);
  resizeRaf = requestAnimationFrame(() => state.charts.forEach((f) => { try { f(); } catch (e) { /* ignore */ } }));
}

// ---- helpers: inline confirm, downloads
function inlineConfirm(trigger, message, label, onYes) {
  const box = document.createElement('div');
  box.className = 'confirm';
  box.setAttribute('role', 'group');
  box.setAttribute('aria-label', 'Confirm');
  box.innerHTML = '<p>' + esc(message) + '</p><div class="btn-row"><button type="button" class="btn btn-danger solid" data-x="yes">' + esc(label) + '</button><button type="button" class="btn" data-x="no">Keep it</button></div>';
  trigger.hidden = true;
  trigger.parentNode.insertBefore(box, trigger.nextSibling);
  const timer = setTimeout(() => cancel(false), 10000);
  function cancel(focus) {
    clearTimeout(timer);
    box.remove();
    trigger.hidden = false;
    if (focus) trigger.focus();
  }
  box.addEventListener('click', (e) => {
    const b = e.target.closest('[data-x]');
    if (!b) return;
    if (b.dataset.x === 'no') cancel(true);
    else { cancel(false); onYes(); }
  });
  box.querySelector('[data-x="no"]').focus();
}
function download(filename, obj) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}
function dateStamp(ms) { const d = new Date(ms); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function exportSession(s) {
  const sc = scoreOf(s);
  return Object.assign({}, s, { score: sc.score, rating: sc.rating.key, snorePct: round1(sc.snorePct) });
}

// ---- night view actions
function currentSession() { return state.sessions.find((x) => x.id === state.route.arg); }
async function saveCurrent() {
  const s = currentSession();
  if (!s) return false;
  return Store.saveSession(s);
}
function flushNote() {
  if (state.noteTimer) {
    clearTimeout(state.noteTimer);
    state.noteTimer = null;
    const s = state.pendingNoteSession;
    if (s) Store.saveSession(s);
  }
}
function setSaveState(txt) { const el = $('saveState'); if (el) el.textContent = txt; }
function cleanTag(raw) { return String(raw || '').replace(/\s+/g, ' ').trim().slice(0, 30); }

async function toggleTag(btn) {
  const s = currentSession();
  if (!s) return;
  const field = btn.dataset.kind === 'factor' ? 'factors' : 'remedies';
  const name = btn.dataset.name;
  const list = s[field] || (s[field] = []);
  const i = list.indexOf(name);
  if (i >= 0) list.splice(i, 1); else list.push(name);
  btn.setAttribute('aria-pressed', String(i < 0));
  if (await saveCurrent()) setSaveState('Saved');
}
async function addCustomTag(kind) {
  const s = currentSession();
  const input = $(kind === 'factor' ? 'addFactor' : 'addRemedy');
  if (!s || !input) return;
  const name = cleanTag(input.value);
  if (!name) { toast('Type a name first.'); return; }
  const names = tagNames(kind);
  const exists = names.find((n) => n.toLowerCase() === name.toLowerCase());
  const useName = exists || name;
  if (!exists) {
    (kind === 'factor' ? state.settings.customFactors : state.settings.customRemedies).push(name);
    await Store.saveSettings(state.settings);
  }
  const field = kind === 'factor' ? 'factors' : 'remedies';
  if (!s[field]) s[field] = [];
  if (s[field].indexOf(useName) < 0) s[field].push(useName);
  await saveCurrent();
  $('tags').innerHTML = tagsSectionHtml(s);
  const again = $(kind === 'factor' ? 'addFactor' : 'addRemedy');
  if (again) again.focus();
  setSaveState('Saved');
}

// ---- audio playback (one shared <audio> element)
const playing = { id: null, url: null, btn: null };
function setPlayBtn(btn, on) {
  if (!btn) return;
  btn.textContent = on ? 'Stop' : 'Play';
}
function stopPlayback() {
  const p = $('player');
  if (p) { try { p.pause(); } catch (e) { /* ignore */ } p.removeAttribute('src'); }
  if (playing.url) URL.revokeObjectURL(playing.url);
  setPlayBtn(playing.btn, false);
  playing.id = null; playing.url = null; playing.btn = null;
}
async function playSample(id, btn) {
  const p = $('player');
  if (playing.id === id) { stopPlayback(); return; }
  stopPlayback();
  const rec = await Store.getSample(id);
  if (!rec || !rec.blob) { toast('That clip is no longer available.'); return; }
  playing.url = URL.createObjectURL(rec.blob);
  playing.id = id; playing.btn = btn;
  p.src = playing.url;
  p.onended = () => stopPlayback();
  try { await p.play(); setPlayBtn(btn, true); }
  catch (e) { toast('Your browser could not play this clip.'); stopPlayback(); }
}
async function deleteSample(id, btn) {
  const s = currentSession();
  if (!s) return;
  if (playing.id === id) stopPlayback();
  if (!(await Store.deleteSample(id))) return;
  s.samplesMeta = (s.samplesMeta || []).filter((m) => m.id !== id);
  await saveCurrent();
  const host = $('samples');
  if (host) host.innerHTML = samplesHtml(s);
  toast('Clip deleted.');
}

// ---- import
function sanitizeSession(raw) {
  if (!raw || typeof raw !== 'object' || raw.id == null) return null;
  const start = Number(raw.start);
  if (!isFinite(start) || !Array.isArray(raw.minutes)) return null;
  const num = (v) => (isFinite(Number(v)) ? Number(v) : 0);
  const minutes = raw.minutes.filter((m) => m && isFinite(Number(m.t))).map((m) => ({
    t: Number(m.t), snoreSec: num(m.snoreSec), quietSec: num(m.quietSec), lightSec: num(m.lightSec), loudSec: num(m.loudSec), epicSec: num(m.epicSec),
    peakDb: num(m.peakDb), floorDb: m.floorDb == null ? null : num(m.floorDb)
  }));
  const strs = (a) => (Array.isArray(a) ? a.map(cleanTag).filter(Boolean) : []);
  const end = isFinite(Number(raw.end)) && raw.end ? Number(raw.end) : start + minutes.length * 60000;
  return {
    id: String(raw.id), start, end, minutes, samplesMeta: [], factors: strs(raw.factors), remedies: strs(raw.remedies),
    notes: typeof raw.notes === 'string' ? raw.notes.slice(0, 2000) : '', sensitivity: raw.sensitivity || 'medium',
    sampleNote: 'imported', lastSave: end
  };
}
async function importFile(file) {
  let data;
  try { data = JSON.parse(await file.text()); }
  catch (e) { toast('That file is not valid JSON.'); return; }
  const list = Array.isArray(data) ? data : Array.isArray(data.sessions) ? data.sessions : data.session ? [data.session] : [];
  const have = new Set(state.sessions.map((s) => s.id));
  let added = 0, skipped = 0, bad = 0;
  for (const raw of list) {
    const s = sanitizeSession(raw);
    if (!s) { bad++; continue; }
    if (have.has(s.id)) { skipped++; continue; }
    if (await Store.saveSession(s)) { state.sessions.push(s); have.add(s.id); added++; }
  }
  const st = state.settings;
  const addTags = (arr, builtin, custom) => arr.forEach((n) => { if (builtin.indexOf(n) < 0 && custom.indexOf(n) < 0) custom.push(n); });
  const src = data && data.settings ? data.settings : {};
  const strs = (a) => (Array.isArray(a) ? a.map(cleanTag).filter(Boolean) : []);
  addTags(strs(src.customFactors), BUILTIN_FACTORS, st.customFactors);
  addTags(strs(src.customRemedies), BUILTIN_REMEDIES, st.customRemedies);
  state.sessions.forEach((s) => { addTags(s.factors || [], BUILTIN_FACTORS, st.customFactors); addTags(s.remedies || [], BUILTIN_REMEDIES, st.customRemedies); });
  await Store.saveSettings(st);
  if (!list.length) toast('No nights found in that file.');
  else toast('Imported ' + added + (added === 1 ? ' night' : ' nights') + '. ' + skipped + ' already here' + (bad ? ', ' + bad + ' skipped as invalid.' : '.'), 5000);
  render(true);
}

// ---- recording flow and sleep mode
function micErrorFor(e) {
  const n = e && e.name;
  let detail;
  if (n === 'InsecureContext') detail = 'Browsers only allow microphone access on pages opened over https.';
  else if (n === 'NotAllowedError' || n === 'SecurityError') detail = 'The microphone is blocked for this site.';
  else if (n === 'NotFoundError' || n === 'OverconstrainedError') detail = 'No microphone was found on this device.';
  else if (n === 'NotReadableError' || n === 'AbortError') detail = 'Another app may be using the microphone.';
  else detail = (e && e.message) ? e.message : 'The microphone did not start.';
  return { detail };
}
function beforeUnload(e) { if (state.recorder) { e.preventDefault(); e.returnValue = ''; return ''; } }

async function startRecording() {
  if (state.recorder || state.starting) return;
  state.starting = true; state.micError = null; state.notice = '';
  if (state.route.view === 'home') render(true);
  const rec = new NightRecorder(state.settings, { onTick: sleepTick, onWake: (ok) => { const w = $('sWarn'); if (w) w.hidden = ok; }, onAutoStop: () => stopRecording() });
  try {
    await rec.start();
  } catch (e) {
    state.starting = false;
    state.micError = micErrorFor(e);
    go('#/');
    render(true);
    return;
  }
  state.starting = false;
  state.recorder = rec;
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  window.addEventListener('beforeunload', beforeUnload);
  showSleep();
}
async function stopRecording() {
  const rec = state.recorder;
  if (!rec) return;
  state.recorder = null;
  window.removeEventListener('beforeunload', beforeUnload);
  hideSleep();
  toast('Saving your night...');
  let s = null;
  try { s = await rec.stop(); } catch (e) { reportError('Could not finish the recording.', e); }
  if (!s) { render(true); return; }
  if (s.end - s.start < 60000) {
    await Store.deleteSession(s.id);
    state.notice = 'That recording was under a minute, so it was not saved.';
    go('#/');
    return;
  }
  state.sessions = state.sessions.filter((x) => x.id !== s.id).concat([s]);
  go('#/night/' + enc(s.id));
}

const sleep = { op: 0.25, ctrlTimer: null, lastMin: -1, lastSec: -1, start: 0, clockTimer: null };
function showSleep() {
  const el = $('sleep');
  sleep.op = state.settings.clockOpacity;
  el.style.setProperty('--op', sleep.op);
  el.hidden = false;
  el.classList.remove('show');
  sleep.start = state.recorder.startMs;
  sleep.lastMin = -1; sleep.lastSec = -1;
  $('sCount').textContent = '0';
  $('sLevel').style.transform = 'scaleX(0)';
  updateClock();
  sleep.clockTimer = setInterval(updateClock, 1000);
  document.body.style.overflow = 'hidden';
  revealControls();
}
function hideSleep() {
  clearInterval(sleep.clockTimer);
  clearTimeout(sleep.ctrlTimer);
  $('sleep').hidden = true;
  document.body.style.overflow = '';
}
function updateClock() {
  const now = Date.now();
  const mkey = Math.floor(now / 60000);
  if (mkey !== sleep.lastMin) { sleep.lastMin = mkey; $('sClock').textContent = fmtClock(now); }
  $('sElapsed').textContent = fmtElapsed(now - sleep.start);
}
function sleepTick(info) {
  const pct = Math.max(0, Math.min(1, (info.db + 80) / 70));
  $('sLevel').style.transform = 'scaleX(' + pct.toFixed(3) + ')';
  const c = $('sCount');
  const v = String(info.count);
  if (c.textContent !== v) c.textContent = v;
}
function revealControls() {
  const el = $('sleep');
  el.classList.add('show');
  clearTimeout(sleep.ctrlTimer);
  sleep.ctrlTimer = setTimeout(() => { if (!holding) el.classList.remove('show'); }, 5000);
}
let holding = false;
function setupHold() {
  const btn = $('holdStop');
  const fill = btn.querySelector('.fill');
  let t0 = 0, raf = 0, done = 0;
  const frame = () => { fill.style.transform = 'scaleX(' + Math.min(1, (performance.now() - t0) / 1500).toFixed(3) + ')'; raf = requestAnimationFrame(frame); };
  const begin = () => {
    if (holding) return;
    holding = true; t0 = performance.now();
    clearTimeout(sleep.ctrlTimer);
    raf = requestAnimationFrame(frame);
    done = setTimeout(() => { end(); stopRecording(); }, 1500);
  };
  const end = () => {
    if (!holding) return;
    holding = false;
    clearTimeout(done); cancelAnimationFrame(raf);
    fill.style.transform = 'scaleX(0)';
    revealControls();
  };
  btn.addEventListener('pointerdown', (e) => { e.preventDefault(); try { btn.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ } begin(); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((n) => btn.addEventListener(n, end));
  btn.addEventListener('keydown', (e) => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); begin(); } });
  btn.addEventListener('keyup', (e) => { if (e.key === ' ' || e.key === 'Enter') end(); });
  btn.addEventListener('blur', end);
  btn.addEventListener('contextmenu', (e) => e.preventDefault());
  $('sleep').addEventListener('pointerdown', revealControls);
}

// ---- crash recovery
async function recoverSessions() {
  let n = 0;
  for (const s of state.sessions.slice()) {
    if (s.end || (state.recorder && state.recorder.session && state.recorder.session.id === s.id)) continue;
    const lastMinute = s.minutes.length ? s.minutes[s.minutes.length - 1].t + 60000 : s.start;
    s.end = Math.max(s.start, Math.min(s.lastSave || lastMinute, lastMinute));
    if (s.end - s.start < 60000) {
      await Store.deleteSession(s.id);
      state.sessions = state.sessions.filter((x) => x.id !== s.id);
      continue;
    }
    const recs = await Store.samplesFor(s.id);
    s.samplesMeta = recs.map((r) => { const m = Object.assign({}, r); delete m.blob; return m; });
    await Store.saveSession(s);
    n++;
  }
  if (n) state.notice = 'An earlier recording stopped unexpectedly. We saved the part we had.';
}

// ---- events
function onMainClick(e) {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  if (a === 'start') startRecording();
  else if (a === 'dismiss-error') { state.micError = null; render(true); }
  else if (a === 'toggle-tag') toggleTag(el);
  else if (a === 'add-tag') addCustomTag(el.dataset.kind);
  else if (a === 'play') playSample(el.dataset.id, el);
  else if (a === 'del-sample') deleteSample(el.dataset.id, el);
  else if (a === 'export-night') {
    const s = currentSession();
    if (s) download('snore-night-' + dateStamp(nightDate(s).getTime()) + '.json', { app: 'snore-tracker', version: 1, exportedAt: new Date().toISOString(), session: exportSession(s) });
  } else if (a === 'arm-delete-night') {
    inlineConfirm(el, 'Delete this night and its audio clips? You cannot undo this.', 'Delete night', async () => {
      const s = currentSession();
      if (!s) return;
      stopPlayback();
      if (await Store.deleteSession(s.id)) {
        state.sessions = state.sessions.filter((x) => x.id !== s.id);
        toast('Night deleted.');
        go('#/history');
      }
    });
  } else if (a === 'export-all') {
    download('snore-tracker-export-' + dateStamp(Date.now()) + '.json', {
      app: 'snore-tracker', version: 1, exportedAt: new Date().toISOString(),
      settings: { customFactors: state.settings.customFactors, customRemedies: state.settings.customRemedies },
      sessions: doneSessions().map(exportSession)
    });
  } else if (a === 'import') { const f = $('importFile'); if (f) f.click(); }
  else if (a === 'test-mic') toggleMicTest();
  else if (a === 'remove-custom') {
    const list = el.dataset.kind === 'factor' ? state.settings.customFactors : state.settings.customRemedies;
    const i = list.indexOf(el.dataset.name);
    if (i >= 0) { list.splice(i, 1); Store.saveSettings(state.settings); render(true); }
  } else if (a === 'arm-delete-all') {
    inlineConfirm(el, 'Delete every night, audio clip and setting stored in this browser? You cannot undo this.', 'Delete everything', async () => {
      stopPlayback();
      if (await Store.clearAll()) {
        state.sessions = [];
        state.settings = normalizeSettings(null);
        await Store.saveSettings(state.settings);
        toast('All data deleted.');
        render(true);
      }
    });
  }
}
function onMainInput(e) {
  const t = e.target;
  if (t.id === 'notes') {
    const s = currentSession();
    if (!s) return;
    s.notes = t.value;
    state.pendingNoteSession = s;
    setSaveState('Saving...');
    clearTimeout(state.noteTimer);
    state.noteTimer = setTimeout(async () => { state.noteTimer = null; if (await Store.saveSession(s)) setSaveState('Saved'); }, 400);
    return;
  }
  if (t.dataset && t.dataset.field === 'maxSamples') { $('maxSamplesOut').textContent = t.value; }
  if (t.dataset && t.dataset.field === 'clockOpacity') { $('clockOut').textContent = t.value + '%'; $('clockPrev').style.opacity = String(t.value / 100); }
}
async function onMainChange(e) {
  const t = e.target;
  if (t.id === 'importFile') {
    const f = t.files && t.files[0];
    if (f) await importFile(f);
    t.value = '';
    return;
  }
  const f = t.dataset && t.dataset.field;
  if (!f) return;
  const st = state.settings;
  if (f === 'sensitivity') st.sensitivity = t.value;
  else if (f === 'recordSamples') st.recordSamples = t.checked;
  else if (f === 'maxSamples') st.maxSamples = Math.round(clampNum(t.value, 5, 50, 20));
  else if (f === 'autoStopHours') st.autoStopHours = Number(t.value);
  else if (f === 'clockOpacity') st.clockOpacity = clampNum(Number(t.value) / 100, 0.05, 0.6, 0.25);
  await Store.saveSettings(st);
}

// ---- microphone test
function stopMicTest() {
  if (state.micTest) { state.micTest.cancel(); state.micTest = null; }
}
async function toggleMicTest() {
  const btn = $('micBtn'), bar = $('micBar'), txt = $('micText');
  if (state.micTest) { stopMicTest(); return; }
  if (state.recorder) { toast('Stop the current recording first.'); return; }
  btn.disabled = true;
  txt.textContent = 'Asking for the microphone...';
  try {
    const ctl = await runMicTest({
      onLevel: (db, left) => {
        bar.style.transform = 'scaleX(' + Math.max(0, Math.min(1, (db + 80) / 70)).toFixed(3) + ')';
        txt.textContent = 'Listening. ' + Math.round(db) + ' dB. ' + left + ' s left.';
      },
      onDone: (peak) => {
        state.micTest = null;
        const b = $('micBtn'), t = $('micText'), br = $('micBar');
        if (br) br.style.transform = 'scaleX(0)';
        if (b) { b.disabled = false; b.textContent = 'Test microphone'; }
        if (t) t.textContent = peak < -70 ? 'Done. Peak ' + Math.round(peak) + ' dB. That is very quiet. Move the phone closer or check the mic is not covered.' : 'Done. Peak ' + Math.round(peak) + ' dB. The microphone works.';
      }
    });
    state.micTest = ctl;
    btn.disabled = false;
    btn.textContent = 'Stop test';
  } catch (e) {
    btn.disabled = false;
    const m = micErrorFor(e);
    txt.textContent = m.detail + ' Allow the microphone in your browser settings, and open this page over https.';
  }
}

// ---- boot
async function boot() {
  setupHold();
  $('main').addEventListener('click', onMainClick);
  $('main').addEventListener('input', onMainInput);
  $('main').addEventListener('change', onMainChange);
  window.addEventListener('hashchange', onRoute);
  window.addEventListener('resize', redrawCharts);
  window.addEventListener('pagehide', () => { flushNote(); if (state.recorder) state.recorder.persist(); });
  try {
    const mq = window.matchMedia('(prefers-color-scheme: light)');
    if (mq.addEventListener) mq.addEventListener('change', redrawCharts);
  } catch (e) { /* ignore */ }
  state.settings = await Store.loadSettings();
  state.sessions = await Store.allSessions();
  await recoverSessions();
  state.route = parseRoute();
  render(false);
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('./sw.js').catch((e) => { try { console.warn('Service worker failed', e); } catch (x) { /* ignore */ } });
  }
}

// Test hooks; the detector and score code are pure so Node can exercise them.
const __root = typeof window !== 'undefined' ? window : globalThis;
__root.__snore = { SnoreDetector, computeScore, chooseSampleSlot, classify, ratingFor };
if (typeof document !== 'undefined' && document.getElementById('main')) boot();
</script>
