<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snore Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Record a night, see when and how loudly you snore, and test what helps.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0a0d1c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f3fa" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Snore Tracker">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
  color-scheme: dark;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  /* neutrals: deep navy / indigo */
  --bg: #0a0d1c;
  --bg-2: #0f1328;
  --surface: #141a33;
  --surface-2: #1b2242;
  --border: #283056;
  --text: #e9ecfa;
  --text-dim: #a4acd0;
  --text-faint: #8089b0;
  --focus: #8fb4ff;
  /* one warm accent, plus its intensity scale (same hue, rising saturation) */
  --accent: #ffb347;
  --accent-ink: #2a1600;
  --accent-soft: rgba(255, 179, 71, 0.14);
  --c-quiet: #a49985;
  --c-light: #d6a85f;
  --c-loud: #f28f22;
  --c-epic: #ff5a14;
  /* semantic: rating chips and states */
  --ok: #62d6a0;   --ok-bg: rgba(98, 214, 160, 0.14);
  --mild: #e6cf5c; --mild-bg: rgba(230, 207, 92, 0.14);
  --mod: #f59a45;  --mod-bg: rgba(245, 154, 69, 0.16);
  --bad: #ff7272;  --bad-bg: rgba(255, 114, 114, 0.14);
  --good-delta: #62d6a0;
  --bad-delta: #ff9a6b;
  /* charts */
  --chart-text: var(--text-dim);
  --chart-grid: rgba(164, 172, 208, 0.18);
  --chart-line: var(--accent);
  /* sleep mode */
  --sleep-bg: #030408;
  --sleep-fg: #ffb347;
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg: #f2f3fa;
    --bg-2: #ffffff;
    --surface: #ffffff;
    --surface-2: #e8eaf6;
    --border: #cfd4ea;
    --text: #141935;
    --text-dim: #444c74;
    --text-faint: #646d96;
    --focus: #1c4fd8;
    --accent: #b25800;
    --accent-ink: #ffffff;
    --accent-soft: rgba(178, 88, 0, 0.12);
    --c-quiet: #b7a98f;
    --c-light: #dfa346;
    --c-loud: #e8731a;
    --c-epic: #d4440a;
    --ok: #0b7a4e;   --ok-bg: rgba(11, 122, 78, 0.12);
    --mild: #7a6000; --mild-bg: rgba(160, 125, 0, 0.14);
    --mod: #a14a00;  --mod-bg: rgba(200, 100, 0, 0.13);
    --bad: #b3202a;  --bad-bg: rgba(179, 32, 42, 0.10);
    --good-delta: #0b7a4e;
    --bad-delta: #a14a00;
    --chart-grid: rgba(68, 76, 116, 0.16);
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 var(--font);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3 { line-height: 1.2; margin: 0; }
h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 17px; font-weight: 650; }
p { margin: 0 0 10px; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--text-dim); }
.faint { color: var(--text-faint); }
.small { font-size: 13px; }

.wrap {
  max-width: 720px;
  margin: 0 auto;
  padding-top: max(16px, env(safe-area-inset-top));
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
  padding-left: max(16px, env(safe-area-inset-left));
  padding-right: max(16px, env(safe-area-inset-right));
}
.wrap:focus { outline: none; }
.page-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 6px 0 16px; flex-wrap: wrap; }
.back { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; text-decoration: none; font-weight: 600; margin-left: -6px; padding: 0 6px; }

/* tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--bg-2);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabs {
  max-width: 720px; margin: 0 auto; display: flex;
  padding-left: max(8px, env(safe-area-inset-left));
  padding-right: max(8px, env(safe-area-inset-right));
}
.tabs a {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 58px; padding: 6px 4px; color: var(--text-faint); text-decoration: none; font-size: 12px; font-weight: 600;
}
.tabs a[aria-current="page"] { color: var(--accent); }
.tabs svg { width: 22px; height: 22px; }

/* cards and layout */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin: 0 0 14px; min-width: 0; }
fieldset.card { margin-left: 0; margin-right: 0; }
.card > h2, fieldset.card > legend { margin-bottom: 10px; }
legend { padding: 0; font-size: 17px; font-weight: 650; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.stack > * + * { margin-top: 12px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 8px 16px; border-radius: 12px; cursor: pointer;
  background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
  font-weight: 600; text-decoration: none;
}
.btn:hover { border-color: var(--text-faint); }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn-danger { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn-danger.solid { background: var(--bad); color: #16080a; }
.btn:disabled { opacity: 0.55; cursor: default; }
.btn-start {
  width: 100%; min-height: 76px; font-size: 21px; font-weight: 700; border-radius: 20px; border: 0; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; gap: 12px;
}
.btn-start svg { width: 28px; height: 28px; }
.btn-start:active { transform: scale(0.99); }
.hint { margin: 10px 2px 0; font-size: 13px; color: var(--text-dim); text-align: center; }

.alert { border: 1px solid var(--bad); background: var(--bad-bg); border-radius: 12px; padding: 12px 14px; margin: 0 0 14px; }
.alert strong { display: block; margin-bottom: 4px; }
.alert ul { margin: 6px 0 0; padding-left: 20px; }
.note { border: 1px solid var(--border); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: 14px; color: var(--text-dim); }

/* chips */
.chip { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 650; line-height: 1.6; border: 1px solid transparent; white-space: nowrap; }
.rate-quiet { color: var(--ok); background: var(--ok-bg); border-color: var(--ok); }
.rate-mild { color: var(--mild); background: var(--mild-bg); border-color: var(--mild); }
.rate-moderate { color: var(--mod); background: var(--mod-bg); border-color: var(--mod); }
.rate-severe { color: var(--bad); background: var(--bad-bg); border-color: var(--bad); }
.cls-chip { color: var(--text); background: var(--surface-2); border-color: var(--border); gap: 6px; }
.cls-chip::before { content: ""; width: 9px; height: 9px; border-radius: 3px; background: var(--dot, var(--c-light)); }
.cls-quiet { --dot: var(--c-quiet); } .cls-light { --dot: var(--c-light); } .cls-loud { --dot: var(--c-loud); } .cls-epic { --dot: var(--c-epic); }

.tag-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.tag {
  min-height: 40px; padding: 6px 14px; border-radius: 999px; cursor: pointer;
  background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim); font-weight: 600; font-size: 14px;
}
.tag[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
.tag[aria-pressed="true"]::before { content: "\2713\00a0"; color: var(--accent); }
.add-row { display: flex; gap: 8px; margin-top: 12px; }
.add-row input { flex: 1; min-width: 0; }
input[type="text"], textarea, select {
  background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; min-height: 44px; width: 100%;
}
textarea { min-height: 96px; resize: vertical; }
select { width: auto; }

/* score */
.score-row { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
.score-num { font-size: 56px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
.score-side { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 0 0 14px; }
.stats > div { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.stats dt { font-size: 12px; color: var(--text-dim); font-weight: 600; }
.stats dd { margin: 2px 0 0; font-size: 20px; font-weight: 700; }
.stats dd small { font-size: 12px; font-weight: 500; color: var(--text-dim); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; border-left: 5px solid var(--dot); }
.tile b { display: block; font-size: 22px; line-height: 1.2; }
.tile span { font-size: 13px; color: var(--text-dim); }
@media (min-width: 560px) {
  .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}

/* charts */
.chart { position: relative; }
.chart canvas { display: block; width: 100%; height: 240px; touch-action: pan-y; border-radius: 8px; }
.chart.short canvas { height: 220px; }
.tip {
  position: absolute; z-index: 3; pointer-events: none; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 10px; padding: 6px 10px; font-size: 12px; line-height: 1.45; white-space: nowrap; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
}
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 10px 0 0; padding: 0; list-style: none; font-size: 13px; color: var(--text-dim); }
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--dot); display: inline-block; }

/* lists */
.list { list-style: none; margin: 0; padding: 0; }
.row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center;
  padding: 12px 4px; border-top: 1px solid var(--border); color: inherit; text-decoration: none; min-height: 56px;
}
.list > li:first-child .row { border-top: 0; }
a.row:hover { background: var(--accent-soft); }
.row .meta { color: var(--text-dim); font-size: 13px; }
.row .title { font-weight: 650; }
.row .right { display: flex; align-items: center; gap: 10px; justify-self: end; }
.row .big { font-size: 20px; font-weight: 700; min-width: 3ch; text-align: right; }
.minibar { grid-column: 1 / -1; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.minibar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.sample { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--border); }
.list > li:first-child.sample { border-top: 0; }
.sample .t { font-weight: 650; }
.sample .d { font-size: 13px; color: var(--text-dim); }
.icon-btn { min-width: 44px; min-height: 44px; padding: 0 12px; }
.delta { font-weight: 700; }
.delta.up { color: var(--bad-delta); } .delta.down { color: var(--good-delta); }
.kind { font-size: 12px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.06em; margin-left: 6px; }

details.card > summary { cursor: pointer; font-weight: 650; font-size: 17px; min-height: 28px; }
details.card[open] > summary { margin-bottom: 10px; }
.formula { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: 14px; overflow-wrap: anywhere; }

/* confirm */
.confirm { border: 1px solid var(--bad); background: var(--bad-bg); border-radius: 12px; padding: 12px; margin-top: 10px; }
.confirm p { margin-bottom: 10px; }

/* checklist */
.check { list-style: none; margin: 0; padding: 0; }
.check li + li { margin-top: 4px; }
.check label { display: flex; gap: 12px; align-items: center; min-height: 44px; cursor: pointer; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }

/* settings controls */
.field { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 48px; }
.field + .field { border-top: 1px solid var(--border); padding-top: 8px; margin-top: 8px; }
.field .lbl { font-weight: 600; }
.field .sub { display: block; font-size: 13px; color: var(--text-dim); font-weight: 400; }
.field input[type="range"] { width: 160px; accent-color: var(--accent); }
.out { min-width: 3.2em; text-align: right; font-weight: 700; }
.seg { display: flex; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--surface-2); }
.seg label { flex: 1; text-align: center; position: relative; }
.seg input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.seg span { display: block; padding: 10px 6px; min-height: 44px; color: var(--text-dim); font-weight: 650; }
.seg input:checked + span { background: var(--accent); color: var(--accent-ink); }
.seg input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: -3px; }
.switch { position: relative; width: 52px; height: 32px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; width: 100%; height: 100%; }
.switch i { position: absolute; inset: 0; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; transition: background 0.15s; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--text-dim); transition: transform 0.15s; }
.switch input:checked + i { background: var(--accent); border-color: var(--accent); }
.switch input:checked + i::after { transform: translateX(20px); background: var(--accent-ink); }
.switch input:focus-visible + i { outline: 2px solid var(--focus); outline-offset: 2px; }
.meter { height: 12px; background: var(--surface-2); border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
.meter i { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: left; transform: scaleX(0); }
.preview { display: flex; align-items: center; justify-content: center; background: var(--sleep-bg); border-radius: 12px; padding: 14px; margin-top: 10px; }
.preview b { font-size: 44px; font-weight: 300; color: var(--sleep-fg); }

/* empty state illustration */
.ghost { width: 100%; height: auto; display: block; margin: 4px 0 10px; }
.ghost rect { stroke-width: 1.5; stroke-dasharray: 4 3; }
.steps { margin: 0; padding-left: 20px; }
.steps li { margin: 4px 0; }

.toast {
  position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); transform: translate(-50%, 8px);
  max-width: min(92vw, 520px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px;
  opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 80; text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* sleep mode */
.sleep {
  position: fixed; inset: 0; z-index: 60; background: var(--sleep-bg); color: var(--sleep-fg); --op: 0.25;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px, env(safe-area-inset-left));
  -webkit-user-select: none; user-select: none; touch-action: manipulation; cursor: default;
}
.sleep-clock { font-size: clamp(72px, 24vw, 150px); font-weight: 200; line-height: 1; opacity: var(--op); letter-spacing: 0.02em; }
.sleep-meta { font-size: 18px; opacity: calc(var(--op) * 0.9); text-align: center; }
.sleep-level { width: min(72vw, 360px); height: 8px; border-radius: 4px; background: rgba(255, 179, 71, 0.12); overflow: hidden; opacity: calc(var(--op) * 1.6); }
.sleep-level i { display: block; height: 100%; width: 100%; background: var(--sleep-fg); transform-origin: left; transform: scaleX(0); }
.sleep-count { font-size: 16px; opacity: calc(var(--op) * 0.9); }
.sleep-warn { font-size: 13px; max-width: 320px; text-align: center; opacity: calc(var(--op) * 1.4); }
.sleep-controls { display: flex; flex-direction: column; align-items: center; gap: 10px; opacity: 0; pointer-events: none; transition: opacity 0.6s; }
.sleep.show .sleep-controls { opacity: 1; pointer-events: auto; transition-duration: 0.15s; }
.hold {
  position: relative; overflow: hidden; width: 240px; min-height: 60px; border-radius: 16px; cursor: pointer;
  background: transparent; color: var(--sleep-fg); border: 1.5px solid var(--sleep-fg); font-weight: 650; font-size: 18px;
  -webkit-user-select: none; user-select: none; touch-action: none;
}
.hold .fill { position: absolute; inset: 0; background: var(--sleep-fg); opacity: 0.35; transform-origin: left; transform: scaleX(0); }
.hold span.l { position: relative; }
.sleep .hint { color: var(--sleep-fg); opacity: 0.7; margin: 0; }
.sleep :focus-visible { outline-color: var(--sleep-fg); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
</style>
</head>

<main id="main" class="wrap" tabindex="-1" aria-live="off"><p class="muted">Loading...</p></main>

<nav class="tabbar" aria-label="Main">
  <div class="tabs">
    <a href="#/" data-tab="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span>Home</span>
    </a>
    <a href="#/history" data-tab="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
      <span>History</span>
    </a>
    <a href="#/settings" data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      <span>Settings</span>
    </a>
  </div>
</nav>

<div id="sleep" class="sleep" hidden aria-label="Recording in progress">
  <div class="sleep-clock" id="sClock">00:00</div>
  <div class="sleep-meta">Recording <span id="sElapsed">0:00:00</span></div>
  <div class="sleep-level" role="img" aria-label="Live sound level"><i id="sLevel"></i></div>
  <div class="sleep-count"><span id="sCount">0</span> snores heard</div>
  <div class="sleep-warn" id="sWarn" hidden>This browser cannot keep the screen awake. Turn off auto-lock in your device settings for tonight.</div>
  <div class="sleep-controls" id="sControls">
    <button type="button" class="hold" id="holdStop" aria-label="Stop recording. Press and hold for one and a half seconds."><i class="fill"></i><span class="l">Hold to stop</span></button>
    <p class="hint small">Hold for 1.5 seconds</p>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<audio id="player" preload="none"></audio>
<noscript><p style="padding:16px">Snore Tracker needs JavaScript.</p></noscript>
<script>
'use strict';

// ---- storage
const DB_NAME = 'snoretracker';
const DB_VERSION = 1;
const BUILTIN_FACTORS = ['Alcohol', 'Caffeine', 'Late meal', 'Blocked nose', 'Very tired', 'Stress', 'Exercise', 'Sleeping on back', 'New pillow'];
const BUILTIN_REMEDIES = ['Nasal strips', 'Mouth tape', 'Side sleeping', 'Anti-snore pillow', 'Mouth guard', 'Humidifier', 'Nasal spray', 'Throat spray', 'No alcohol'];
const DEFAULT_SETTINGS = {
  key: 'app',
  sensitivity: 'medium',
  recordSamples: true,
  maxSamples: 20,
  autoStopHours: 0,
  clockOpacity: 0.25,
  customFactors: [],
  customRemedies: []
};

function clampNum(v, lo, hi, dflt) {
  v = Number(v);
  if (!isFinite(v)) return dflt;
  return Math.min(hi, Math.max(lo, v));
}
function normalizeSettings(s) {
  const o = Object.assign({}, DEFAULT_SETTINGS, s || {});
  o.key = 'app';
  if (['low', 'medium', 'high'].indexOf(o.sensitivity) < 0) o.sensitivity = 'medium';
  o.recordSamples = o.recordSamples !== false;
  o.maxSamples = Math.round(clampNum(o.maxSamples, 5, 50, 20));
  o.autoStopHours = [0, 6, 8, 10, 12].indexOf(Number(o.autoStopHours)) >= 0 ? Number(o.autoStopHours) : 0;
  o.clockOpacity = clampNum(o.clockOpacity, 0.05, 0.6, 0.25);
  o.customFactors = Array.isArray(o.customFactors) ? o.customFactors.map(String) : [];
  o.customRemedies = Array.isArray(o.customRemedies) ? o.customRemedies.map(String) : [];
  return o;
}

// Tiny promise wrapper around IndexedDB.
const idb = (() => {
  let opening = null;
  function open() {
    if (!opening) {
      opening = new Promise((resolve, reject) => {
        if (typeof indexedDB === 'undefined') { reject(new Error('IndexedDB is not available')); return; }
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains('sessions')) db.createObjectStore('sessions', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('samples')) {
            const st = db.createObjectStore('samples', { keyPath: 'id' });
            st.createIndex('sessionId', 'sessionId', { unique: false });
          }
          if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'key' });
        };
        req.onsuccess = () => {
          const db = req.result;
          db.onversionchange = () => { db.close(); opening = null; };
          resolve(db);
        };
        req.onerror = () => reject(req.error || new Error('Could not open the database'));
        req.onblocked = () => reject(new Error('The database is blocked by another tab'));
      });
      opening.catch(() => { opening = null; });
    }
    return opening;
  }
  async function run(store, mode, fn) {
    const db = await open();
    return new Promise((resolve, reject) => {
      let result;
      const t = db.transaction(store, mode);
      const r = fn(t.objectStore(store));
      if (r) r.onsuccess = () => { result = r.result; };
      t.oncomplete = () => resolve(result);
      t.onerror = () => reject(t.error || (r && r.error) || new Error('Storage error'));
      t.onabort = () => reject(t.error || new Error('Storage transaction aborted'));
    });
  }
  return {
    get: (s, k) => run(s, 'readonly', (st) => st.get(k)),
    put: (s, v) => run(s, 'readwrite', (st) => st.put(v)),
    del: (s, k) => run(s, 'readwrite', (st) => st.delete(k)),
    all: (s) => run(s, 'readonly', (st) => st.getAll()),
    clear: (s) => run(s, 'readwrite', (st) => st.clear()),
    byIndex: (s, i, v) => run(s, 'readonly', (st) => st.index(i).getAll(v)),
    async delByIndex(s, i, v) {
      const keys = await run(s, 'readonly', (st) => st.index(i).getAllKeys(v));
      if (!keys || !keys.length) return;
      await run(s, 'readwrite', (st) => { keys.forEach((k) => st.delete(k)); return null; });
    }
  };
})();

// Every storage call goes through Store: it catches errors and shows a toast.
const Store = {
  async loadSettings() {
    try { return normalizeSettings(await idb.get('settings', 'app')); }
    catch (e) { reportError('Could not load your settings.', e); return normalizeSettings(null); }
  },
  async saveSettings(s) {
    try { await idb.put('settings', s); return true; }
    catch (e) { reportError('Could not save your settings.', e); return false; }
  },
  async allSessions() {
    try { return (await idb.all('sessions')) || []; }
    catch (e) { reportError('Could not load your nights.', e); return []; }
  },
  async saveSession(s) {
    try { await idb.put('sessions', s); return true; }
    catch (e) { reportError('Could not save this night.', e); return false; }
  },
  async deleteSession(id) {
    try { await idb.delByIndex('samples', 'sessionId', id); await idb.del('sessions', id); return true; }
    catch (e) { reportError('Could not delete this night.', e); return false; }
  },
  async putSample(rec) {
    try { await idb.put('samples', rec); return true; }
    catch (e) { reportError('Could not save an audio sample.', e); return false; }
  },
  async getSample(id) {
    try { return await idb.get('samples', id); }
    catch (e) { reportError('Could not load the audio sample.', e); return null; }
  },
  async deleteSample(id) {
    try { await idb.del('samples', id); return true; }
    catch (e) { reportError('Could not delete the audio sample.', e); return false; }
  },
  async samplesFor(sessionId) {
    try { return (await idb.byIndex('samples', 'sessionId', sessionId)) || []; }
    catch (e) { reportError('Could not read audio samples.', e); return []; }
  },
  async clearAll() {
    try { await idb.clear('sessions'); await idb.clear('samples'); await idb.clear('settings'); return true; }
    catch (e) { reportError('Could not delete your data.', e); return false; }
  }
};

// ---- detector
const SENS_DB = { low: 15, medium: 10, high: 6 };
const CLASS_KEYS = ['quiet', 'light', 'loud', 'epic'];
const round1 = (x) => Math.round(x * 10) / 10;
const round2 = (x) => Math.round(x * 100) / 100;

// Intensity class from peak dB above the noise floor.
function classify(aboveDb) {
  if (aboveDb < 12) return 'quiet';
  if (aboveDb < 20) return 'light';
  if (aboveDb < 30) return 'loud';
  return 'epic';
}

// Pure snore detector. Feed it one frame at a time (about every 100 ms):
//   push(db, bandRatio, nowMs) -> array of snore events that finished in this frame.
// db is the frame level in dBFS, bandRatio is energy(60-1200 Hz) / total energy at that frame.
class SnoreDetector {
  constructor(opts) {
    opts = opts || {};
    this.frameMs = opts.frameMs || 100;
    this.warmupMs = opts.warmupMs != null ? opts.warmupMs : 5000;
    this.floorWindowMs = 60000;
    this.confirmMs = 300;   // above threshold this long: a sound event starts
    this.endMs = 300;       // below threshold this long: it ends
    this.minEventMs = 400;
    this.maxEventMs = 4000;
    this.minGapMs = 2000;   // rhythm: another event 2 to 8 s earlier (start to start)
    this.maxGapMs = 8000;
    this.minBandRatio = 0.5;
    this.gapResetMs = 2500; // a pause in frames (suspended page) closes any open event
    this.setSensitivity(opts.sensitivity || 'medium');
    this.reset();
  }
  setSensitivity(s) {
    this.sensitivity = SENS_DB[s] != null ? s : 'medium';
    this.offsetDb = SENS_DB[this.sensitivity];
  }
  reset() {
    this.firstTs = null;
    this.lastNow = null;
    this.ts = [];
    this.dbs = [];
    this.head = 0;
    this.floorDb = null;
    this.lastFloorAt = -Infinity;
    this.run = null;
    this.recent = [];
    this.stats = { sound: 0, tooShort: 0, tooLong: 0, highPitch: 0, qualified: 0, snores: 0 };
  }
  get thresholdDb() { return this.floorDb == null ? null : this.floorDb + this.offsetDb; }

  push(db, bandRatio, nowMs) {
    const out = [];
    if (!isFinite(db)) db = -100;
    db = Math.max(-100, db);
    if (this.firstTs == null) this.firstTs = nowMs;
    if (this.lastNow != null && nowMs - this.lastNow > this.gapResetMs) {
      const ev = this._closeRun();
      if (ev) this._handle(ev, out);
    }
    this.lastNow = nowMs;

    // rolling 60 s buffer of frame levels; the noise floor is its 20th percentile, refreshed every second
    this.ts.push(nowMs);
    this.dbs.push(db);
    while (this.head < this.ts.length && this.ts[this.head] < nowMs - this.floorWindowMs) this.head++;
    if (this.head > 2000) {
      this.ts = this.ts.slice(this.head);
      this.dbs = this.dbs.slice(this.head);
      this.head = 0;
    }
    if (nowMs - this.lastFloorAt >= 1000) {
      this.lastFloorAt = nowMs;
      this._updateFloor();
    }
    if (this.floorDb == null || nowMs - this.firstTs < this.warmupMs) return out;

    const thr = this.floorDb + this.offsetDb;
    const above = db > thr;
    let r = this.run;
    if (above) {
      if (!r) {
        r = this.run = { start: nowMs, lastAbove: nowMs, peakDb: db, ratio: bandRatio, floorDb: this.floorDb, thr, confirmed: false, belowSince: null };
      } else {
        r.lastAbove = nowMs;
        r.belowSince = null;
        if (db > r.peakDb) { r.peakDb = db; r.ratio = bandRatio; }
      }
      if (!r.confirmed && r.lastAbove + this.frameMs - r.start >= this.confirmMs) r.confirmed = true;
    } else if (r) {
      if (r.belowSince == null) r.belowSince = nowMs;
      if (nowMs - r.belowSince + this.frameMs >= this.endMs) {
        const ev = this._closeRun();
        if (ev) this._handle(ev, out);
      }
    }
    return out;
  }

  // Close any open event (end of recording).
  flush() {
    const out = [];
    const ev = this._closeRun();
    if (ev) this._handle(ev, out);
    return out;
  }

  _updateFloor() {
    const n = this.dbs.length - this.head;
    if (n < 10) { this.floorDb = null; return; }
    const a = Float64Array.from(this.dbs.slice(this.head)).sort();
    this.floorDb = a[Math.floor(0.2 * (n - 1))];
  }
  _closeRun() {
    const r = this.run;
    this.run = null;
    if (!r || !r.confirmed) return null;
    const end = r.lastAbove + this.frameMs;
    return { start: r.start, end, durMs: end - r.start, peakDb: r.peakDb, aboveDb: r.peakDb - r.floorDb, floorDb: r.floorDb, ratio: r.ratio };
  }
  _handle(s, out) {
    this.stats.sound++;
    if (s.durMs < this.minEventMs) { this.stats.tooShort++; return; }
    if (s.durMs > this.maxEventMs) { this.stats.tooLong++; return; }
    if (!(s.ratio >= this.minBandRatio)) { this.stats.highPitch++; return; }
    this.stats.qualified++;
    this.recent = this.recent.filter((e) => s.start - e.start <= this.maxGapMs);
    const rec = { start: s.start, counted: false, ev: s };
    let partnered = false;
    for (const e of this.recent) {
      const d = s.start - e.start;
      if (d >= this.minGapMs && d <= this.maxGapMs) {
        partnered = true;
        if (!e.counted) { e.counted = true; out.push(this._snore(e.ev, true)); }
      }
    }
    if (partnered) { rec.counted = true; out.push(this._snore(s, false)); }
    this.recent.push(rec);
  }
  _snore(s, retro) {
    this.stats.snores++;
    return Object.assign({}, s, { cls: classify(s.aboveDb), snore: true, retro });
  }
}

// Snore Score: 100 x (1 quiet + 2 light + 3 loud + 4 epic seconds) / (4 x total seconds).
function ratingFor(score) {
  if (score < 10) return { key: 'quiet', label: 'Quiet' };
  if (score < 25) return { key: 'mild', label: 'Mild' };
  if (score <= 50) return { key: 'moderate', label: 'Moderate' };
  return { key: 'severe', label: 'Severe' };
}
function computeScore(minutes, totalSec) {
  let q = 0, l = 0, o = 0, e = 0, sn = 0;
  const list = Array.isArray(minutes) ? minutes : [];
  for (const m of list) {
    q += m.quietSec || 0; l += m.lightSec || 0; o += m.loudSec || 0; e += m.epicSec || 0; sn += m.snoreSec || 0;
  }
  const classSum = q + l + o + e;
  const snore = sn > 0 ? sn : classSum;
  const total = totalSec > 0 ? totalSec : list.length * 60;
  if (!(total > 0)) {
    return { score: 0, rating: ratingFor(0), totalSec: 0, snoreSec: 0, snorePct: 0, loudPct: 0, epicPct: 0, quietSec: 0, lightSec: 0, loudSec: 0, epicSec: 0 };
  }
  const raw = Math.min(100, 100 * (q + 2 * l + 3 * o + 4 * e) / (4 * total));
  const score = Math.round(raw * 10) / 10;
  const pct = (x) => Math.min(100, 100 * x / total);
  return {
    score, rating: ratingFor(score), totalSec: total, snoreSec: snore,
    snorePct: pct(snore), loudPct: pct(o), epicPct: pct(e),
    quietSec: q, lightSec: l, loudSec: o, epicSec: e
  };
}

// ---- recorder
function pickMime() {
  if (typeof MediaRecorder === 'undefined' || typeof MediaRecorder.isTypeSupported !== 'function') return '';
  const prefs = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'];
  for (const m of prefs) { try { if (MediaRecorder.isTypeSupported(m)) return m; } catch (e) { /* try next */ } }
  return '';
}

function sampleHour(t, startMs) { return Math.max(0, Math.floor((t - startMs) / 3600000)); }

// Decide what to do with a new sample candidate: keep the loudest N, but keep at least one per hour of the night.
function chooseSampleSlot(samples, cand, max, startMs) {
  if (samples.length < max) return { action: 'add' };
  const counts = {};
  for (const s of samples) { const h = sampleHour(s.t, startMs); counts[h] = (counts[h] || 0) + 1; }
  const candEmpty = !counts[sampleHour(cand.t, startMs)];
  let victim = null;
  for (const s of samples) {
    if (counts[sampleHour(s.t, startMs)] > 1 && (!victim || s.aboveDb < victim.aboveDb)) victim = s;
  }
  if (!victim) return { action: 'skip' };
  if (candEmpty || cand.aboveDb > victim.aboveDb) return { action: 'replace', victim };
  return { action: 'skip' };
}

// Microphone -> AnalyserNode. Used for recording and for the settings mic test.
class AudioInput {
  constructor() {
    this.stream = null; this.ctx = null; this.analyser = null;
    this.timeBuf = null; this.freqBuf = null; this.byteBuf = null;
    this.lo = 0; this.hi = 0;
  }
  async open() {
    if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      const err = new Error('Microphone access needs a secure (https) page.');
      err.name = 'InsecureContext';
      throw err;
    }
    this.stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      if (this.ctx.state === 'suspended') await this.ctx.resume().catch(() => {});
      const src = this.ctx.createMediaStreamSource(this.stream);
      this.analyser = this.ctx.createAnalyser();
      this.analyser.fftSize = 2048;
      this.analyser.smoothingTimeConstant = 0.2;
      src.connect(this.analyser);
    } catch (e) {
      this.close();
      throw e;
    }
    const a = this.analyser;
    this.timeBuf = new Float32Array(a.fftSize);
    this.freqBuf = new Float32Array(a.frequencyBinCount);
    this.byteBuf = new Uint8Array(a.fftSize);
    const binHz = this.ctx.sampleRate / a.fftSize;
    this.lo = Math.max(1, Math.ceil(60 / binHz));
    this.hi = Math.min(a.frequencyBinCount - 1, Math.floor(1200 / binHz));
  }
  // One frame: level in dBFS and the 60-1200 Hz share of the energy.
  read() {
    const a = this.analyser, tb = this.timeBuf;
    if (a.getFloatTimeDomainData) {
      a.getFloatTimeDomainData(tb);
    } else {
      a.getByteTimeDomainData(this.byteBuf);
      for (let i = 0; i < tb.length; i++) tb[i] = (this.byteBuf[i] - 128) / 128;
    }
    let sum = 0;
    for (let i = 0; i < tb.length; i++) sum += tb[i] * tb[i];
    const rms = Math.sqrt(sum / tb.length);
    const db = rms > 0 ? Math.max(-100, 20 * Math.log10(rms)) : -100;

    const fb = this.freqBuf;
    if (a.getFloatFrequencyData) {
      a.getFloatFrequencyData(fb);
    } else {
      const bb = new Uint8Array(fb.length);
      a.getByteFrequencyData(bb);
      for (let i = 0; i < fb.length; i++) fb[i] = a.minDecibels + (bb[i] / 255) * (a.maxDecibels - a.minDecibels);
    }
    let band = 0, total = 0;
    for (let i = 1; i < fb.length; i++) {
      const d = fb[i];
      if (!(d > -200)) continue;
      const p = Math.pow(10, d / 10);
      total += p;
      if (i >= this.lo && i <= this.hi) band += p;
    }
    return { db, ratio: total > 0 ? band / total : 0 };
  }
  close() {
    try { if (this.stream) this.stream.getTracks().forEach((t) => t.stop()); } catch (e) { /* ignore */ }
    try { if (this.ctx && this.ctx.state !== 'closed') this.ctx.close(); } catch (e) { /* ignore */ }
    this.stream = null; this.ctx = null;
  }
}

// Records one night: level meter, snore detection, per-minute stats, audio samples, persistence.
class NightRecorder {
  constructor(settings, ui) {
    this.settings = settings;
    this.ui = ui || {};
    this.input = null; this.det = null; this.timer = null; this.session = null;
    this.base = 0; this.curIdx = -1; this.snoreCount = 0;
    this.sampleOn = false; this.mime = ''; this.segTimer = null; this.curSeg = null;
    this.ring = []; this.pending = []; this.samples = []; this.writes = [];
    this.wake = null; this.wakeOk = false; this.stopped = false; this.autoStopFired = false;
    this.saving = Promise.resolve();
    this._onVis = () => this.onVisible();
  }

  async start() {
    const input = new AudioInput();
    await input.open();
    this.input = input;
    try {
      const now = Date.now();
      this.base = Math.floor(now / 60000) * 60000;
      this.session = {
        id: String(now), start: now, end: null, minutes: [], samplesMeta: [], factors: [], remedies: [],
        notes: '', sensitivity: this.settings.sensitivity, sampleNote: '', lastSave: now
      };
      this.det = new SnoreDetector({ sensitivity: this.settings.sensitivity });
      this.setupSamples();
      await this.requestWake();
      document.addEventListener('visibilitychange', this._onVis);
      this.ensureMinute(0);
      this.curIdx = 0;
      await this.persist();
      this.timer = setInterval(() => this.tick(), 100);
    } catch (e) {
      this.releaseAll();
      throw e;
    }
  }

  get startMs() { return this.session ? this.session.start : 0; }

  // ---- wake lock and visibility
  async requestWake() {
    try {
      if (!('wakeLock' in navigator)) { this.wakeOk = false; }
      else if (!this.wake || this.wake.released) {
        this.wake = await navigator.wakeLock.request('screen');
        this.wakeOk = true;
      }
    } catch (e) { this.wakeOk = false; }
    if (this.ui.onWake) this.ui.onWake(this.wakeOk);
  }
  onVisible() {
    if (document.visibilityState !== 'visible' || this.stopped) return;
    this.requestWake();
    const c = this.input && this.input.ctx;
    if (c && c.state !== 'running' && c.state !== 'closed') c.resume().catch(() => {});
  }

  // ---- frame loop
  tick() {
    if (this.stopped) return;
    const now = Date.now();
    let r;
    try { r = this.input.read(); } catch (e) { return; }
    const idx = Math.floor((now - this.base) / 60000);
    if (idx !== this.curIdx) { this.ensureMinute(idx); this.curIdx = idx; this.persist(); }
    const m = this.session.minutes[idx];
    if (r.db > m.peakDb) m.peakDb = round1(r.db);
    const evs = this.det.push(r.db, r.ratio, now);
    if (this.det.floorDb != null) m.floorDb = round1(this.det.floorDb);
    for (const ev of evs) this.onSnore(ev);
    if (this.ui.onTick) this.ui.onTick({ db: r.db, count: this.snoreCount, now, floorDb: this.det.floorDb });
    const h = this.settings.autoStopHours;
    if (h && !this.autoStopFired && now - this.session.start >= h * 3600000) {
      this.autoStopFired = true;
      if (this.ui.onAutoStop) this.ui.onAutoStop();
    }
  }

  ensureMinute(idx) {
    const mins = this.session.minutes;
    while (mins.length <= idx) {
      mins.push({ t: this.base + mins.length * 60000, snoreSec: 0, quietSec: 0, lightSec: 0, loudSec: 0, epicSec: 0, peakDb: -100, floorDb: null });
    }
    return mins[idx];
  }

  onSnore(ev) {
    this.snoreCount++;
    const key = ev.cls + 'Sec';
    let t = ev.start;
    while (t < ev.end) {
      const idx = Math.max(0, Math.floor((t - this.base) / 60000));
      const mEnd = this.base + (idx + 1) * 60000;
      const part = Math.min(ev.end, mEnd) - t;
      const m = this.ensureMinute(idx);
      m.snoreSec = round2(m.snoreSec + part / 1000);
      m[key] = round2(m[key] + part / 1000);
      t += part;
    }
    if (this.sampleOn && ev.aboveDb >= 12) this.sampleCandidate(ev);
  }

  persist() {
    const s = this.session;
    s.lastSave = Date.now();
    s.samplesMeta = this.samples.map((x) => Object.assign({}, x));
    this.saving = this.saving.then(() => Store.saveSession(s));
    return this.saving;
  }

  // ---- audio samples: each 10 s segment is its own standalone file
  setupSamples() {
    if (!this.settings.recordSamples) { this.session.sampleNote = 'off'; return; }
    if (typeof MediaRecorder === 'undefined') { this.session.sampleNote = 'unsupported'; return; }
    this.mime = pickMime();
    this.curSeg = this.startSegment();
    if (!this.curSeg) return;
    this.sampleOn = true;
    this.segTimer = setInterval(() => this.rotateSegment(), 10000);
  }
  sampleFail() {
    this.sampleOn = false;
    this.session.sampleNote = this.session.sampleNote || 'error';
    clearInterval(this.segTimer);
  }
  startSegment() {
    let mr;
    try {
      mr = this.mime
        ? new MediaRecorder(this.input.stream, { mimeType: this.mime, audioBitsPerSecond: 48000 })
        : new MediaRecorder(this.input.stream);
    } catch (e) {
      try { mr = new MediaRecorder(this.input.stream); }
      catch (e2) { this.session.sampleNote = typeof MediaRecorder === 'undefined' ? 'unsupported' : 'error'; return null; }
    }
    const seg = { t0: Date.now(), t1: null, mr, chunks: [], blob: null, done: null };
    seg.done = new Promise((resolve) => {
      mr.ondataavailable = (e) => { if (e.data && e.data.size) seg.chunks.push(e.data); };
      mr.onerror = () => { resolve(seg); };
      mr.onstop = () => {
        seg.t1 = Date.now();
        seg.blob = new Blob(seg.chunks, { type: mr.mimeType || this.mime || 'audio/webm' });
        resolve(seg);
      };
    });
    try { mr.start(); } catch (e) { this.session.sampleNote = 'error'; return null; }
    return seg;
  }
  rotateSegment() {
    if (this.stopped || !this.sampleOn) return;
    const old = this.curSeg;
    const next = this.startSegment(); // start the new one first so no audio is lost
    this.curSeg = next;
    if (old && old.mr.state !== 'inactive') {
      try { old.mr.stop(); } catch (e) { /* ignore */ }
      old.done.then((seg) => this.segmentDone(seg));
    }
    if (!next) this.sampleFail();
  }
  segmentDone(seg) {
    if (!seg || !seg.blob || seg.blob.size < 400) return;
    this.ring.push(seg);
    while (this.ring.length > 2) this.ring.shift(); // ring buffer: last 2 finished chunks
    const keep = [];
    for (const c of this.pending) {
      if (c.mid >= seg.t0 && c.mid <= seg.t1) this.offer(seg, c);
      else if (c.mid > seg.t1) keep.push(c);
    }
    this.pending = keep;
  }
  sampleCandidate(ev) {
    const cand = { mid: (ev.start + ev.end) / 2, t: ev.start, aboveDb: ev.aboveDb, peakDb: ev.peakDb, cls: ev.cls };
    for (const seg of this.ring) {
      if (cand.mid >= seg.t0 && cand.mid <= seg.t1) { this.offer(seg, cand); return; }
    }
    this.pending.push(cand);
  }
  offer(seg, cand) {
    const id = this.session.id + '-' + seg.t0;
    const existing = this.samples.find((s) => s.id === id);
    if (existing) {
      if (cand.aboveDb > existing.aboveDb) {
        Object.assign(existing, { aboveDb: round1(cand.aboveDb), peakDb: round1(cand.peakDb), cls: cand.cls, t: cand.t });
        this.writeSample(existing, seg);
      }
      return;
    }
    const meta = {
      id, sessionId: this.session.id, t: cand.t, peakDb: round1(cand.peakDb), aboveDb: round1(cand.aboveDb), cls: cand.cls,
      mime: seg.blob.type || this.mime, durationMs: seg.t1 - seg.t0, clipStart: seg.t0
    };
    const choice = chooseSampleSlot(this.samples, meta, this.settings.maxSamples, this.session.start);
    if (choice.action === 'skip') return;
    if (choice.action === 'replace') {
      this.samples = this.samples.filter((s) => s !== choice.victim);
      this.writes.push(Store.deleteSample(choice.victim.id));
    }
    this.samples.push(meta);
    this.writeSample(meta, seg);
  }
  writeSample(meta, seg) {
    this.writes.push(Store.putSample(Object.assign({}, meta, { blob: seg.blob })));
  }
  async finishSamples() {
    clearInterval(this.segTimer);
    const seg = this.curSeg;
    this.curSeg = null;
    if (seg && seg.mr.state !== 'inactive') {
      try { seg.mr.stop(); } catch (e) { /* ignore */ }
      const done = await Promise.race([seg.done, new Promise((r) => setTimeout(() => r(null), 3000))]);
      this.segmentDone(done);
    }
    this.pending = [];
    await Promise.all(this.writes);
  }

  releaseAll() {
    clearInterval(this.timer);
    clearInterval(this.segTimer);
    document.removeEventListener('visibilitychange', this._onVis);
    try { if (this.wake && !this.wake.released) this.wake.release(); } catch (e) { /* ignore */ }
    this.wake = null;
    if (this.input) this.input.close();
  }

  async stop() {
    if (this.stopped) return this.session;
    this.stopped = true;
    clearInterval(this.timer);
    const now = Date.now();
    try { for (const ev of this.det.flush()) this.onSnore(ev); } catch (e) { /* ignore */ }
    try { await this.finishSamples(); } catch (e) { /* ignore */ }
    this.ensureMinute(Math.max(0, Math.floor((now - this.base) / 60000)));
    this.session.end = now;
    this.releaseAll();
    await this.persist();
    return this.session;
  }
}

// Microphone test: live level meter for 10 s without starting a session.
async function runMicTest(ui) {
  const input = new AudioInput();
  await input.open();
  const t0 = Date.now();
  let peak = -100, stopped = false;
  const finish = () => {
    if (stopped) return;
    stopped = true;
    clearInterval(timer);
    input.close();
    if (ui.onDone) ui.onDone(peak);
  };
  const timer = setInterval(() => {
    const elapsed = Date.now() - t0;
    let r;
    try { r = input.read(); } catch (e) { return; }
    if (r.db > peak) peak = r.db;
    if (ui.onLevel) ui.onLevel(r.db, Math.max(0, 10 - Math.floor(elapsed / 1000)));
    if (elapsed >= 10000) finish();
  }, 100);
  return { cancel: finish };
}

const CLS_LABEL = { quiet: 'Quiet', light: 'Light', loud: 'Loud', epic: 'Epic' };
const enc = encodeURIComponent;
const pad = (n) => String(n).padStart(2, '0');

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmtClock(ms) { const d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function fmtClockSec(ms) { const d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
function fmtElapsed(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return Math.floor(s / 3600) + ':' + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60);
}
function fmtDuration(ms) {
  const m = Math.max(0, Math.round(ms / 60000));
  if (m < 60) return m + ' min';
  return Math.floor(m / 60) + ' h ' + pad(m % 60) + ' min';
}
function nightDate(s) {
  const d = new Date(s.start);
  if (d.getHours() < 6) d.setDate(d.getDate() - 1); // a 1 am start belongs to the night before
  return d;
}
function fmtNight(s, long) {
  return nightDate(s).toLocaleDateString(undefined, long
    ? { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }
    : { weekday: 'short', day: 'numeric', month: 'short' });
}
function fmtPct(x) { return (Math.round(x * 10) / 10).toFixed(1) + '%'; }
function fmtMin(sec) { return (sec / 60).toFixed(1); }

function scoreOf(s) {
  const total = s.end ? (s.end - s.start) / 1000 : (s.minutes || []).length * 60;
  return computeScore(s.minutes, total);

function ratingChip(r) { return '<span class="chip rate-' + r.key + '">' + esc(r.label) + '</span>'; }
function clsChip(cls) { return '<span class="chip cls-chip cls-' + esc(cls) + '">' + esc(CLS_LABEL[cls] || cls) + '</span>'; }

function computeInsights(sessions) {
  const done = sessions.filter((s) => s.end);
  const scores = new Map(done.map((s) => [s.id, scoreOf(s).score]));
  const out = [];
  const consider = (kind, field, names) => {
    for (const name of names) {
      const withS = done.filter((s) => (s[field] || []).indexOf(name) >= 0);
      const withoutS = done.filter((s) => (s[field] || []).indexOf(name) < 0);
      if (withS.length < 2 || withoutS.length < 2) continue;
      const avg = (arr) => arr.reduce((a, s) => a + scores.get(s.id), 0) / arr.length;
      const a = avg(withS), b = avg(withoutS);
      out.push({ kind, name, withN: withS.length, withoutN: withoutS.length, withAvg: a, withoutAvg: b, diff: a - b });
    }
  };
  const names = (field, builtin, custom) => {
    const set = new Set(builtin.concat(custom));
    done.forEach((s) => (s[field] || []).forEach((n) => set.add(n)));
    return Array.from(set);
  };
  consider('Factor', 'factors', names('factors', BUILTIN_FACTORS, state.settings.customFactors));
  consider('Remedy', 'remedies', names('remedies', BUILTIN_REMEDIES, state.settings.customRemedies));
  out.sort((x, y) => Math.abs(y.diff) - Math.abs(x.diff));
  return out;
}
function insightsHtml(list) {
  const items = computeInsights(list);
  let h = '';
  if (!items.length) {
    h += '<p class="muted">Insights appear once a factor or remedy is tagged on at least 2 nights, with at least 2 other nights without it. Tag them on each night\'s results page.</p>';
  } else {
    h += '<ul class="list">';
    for (const it of items) {
      const sign = it.diff > 0 ? '+' : it.diff < 0 ? '' : '';
      const cls = it.diff > 0.05 ? 'up' : it.diff < -0.05 ? 'down' : '';
      h += '<li class="row"><div><div class="title">' + esc(it.name) + '<span class="kind">' + it.kind + '</span></div>' +
        '<div class="meta">With: ' + it.withAvg.toFixed(1) + ' (' + it.withN + ' nights). Without: ' + it.withoutAvg.toFixed(1) + ' (' + it.withoutN + ' nights).</div></div>' +
        '<div class="right"><span class="delta ' + cls + '">' + sign + it.diff.toFixed(1) + '</span></div></li>';
    }
    h += '</ul><p class="small faint" style="margin-top:10px">Lower scores are quieter. These are correlations from a small sample. They do not prove a cause.</p>';
  }
  return h;
}
